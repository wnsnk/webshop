<link rel="stylesheet" href="/css/styles.css">
<div class="flex-shrink-0 p-3 col col-md-1 small-margin-left" style="width: 20%;">
    <h2>Filters</h2>
    <hr>
    <section>
        <h3>Sorteren</h3>
        <div class="dropdown">

            <button id='sortDropDown' class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"
                aria-expanded="false">
                Sorteren
            </button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item sortDropDown" href="#" id='sortOldNew'>Oudste - Nieuwste</a></li>
                <li><a class="dropdown-item sortDropDown" href="#" id='sortNewOld'>Nieuwste - Oudste</a></li>
                <li><a class="dropdown-item sortDropDown" href="#" id='sortPriceLowHigh'>Prijs: Laag - Hoog</a></li>
                <li><a class="dropdown-item sortDropDown" href="#" id='sortPriceHighLow'>Prijs: Hoog - Laag</a></li>
                <li><a class="dropdown-item sortDropDown" href="#" id='sortNameAZ'>Naam: A - Z</a></li>
                <li><a class="dropdown-item sortDropDown" href="#" id='sortNameZA'>Naam: Z - A</a></li>
            </ul>
        </div>
    </section>
    <hr>
    <section>
        <h3>Prijsbereik</h3>
        <div class='row'>
            <div class='col'>
                <h5>Min.</h5>
                <input type="number" name="" id="minPrice" min='1' max='999' value='1'>

            </div>
            <div class='col'>
                <h5>Max.</h5>
                <input type="number" name="" id="maxPrice" min='1' max='999' value='999'>
            </div>
        </div>
    </section>
</div>
